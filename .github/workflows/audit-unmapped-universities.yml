name: Materialize canonical map locations

on:
  push:
    paths:
      - .github/workflows/audit-unmapped-universities.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write resolved locations into canonical JSON
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/spar_fall_2026_introductions.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const locations = {
            'Sualeha': ['Ann Arbor', 42.2808, -83.743, 'Derived from stated location: Ann Arbor, Michigan'],
            'Ruby Rorty': ['Ann Arbor', 42.2808, -83.743, 'Derived from stated location: Ann Arbor, Michigan'],
            'Anaya Mandal': ['Madison', 43.0731, -89.4012, 'Derived from stated location: Madison, Wisconsin'],
            'Christian Glass': ['Cincinnati', 39.1031, -84.512, 'Derived from stated location: Cincinnati, Ohio'],
            'Lucy Kappai': ['Belfast', 54.5973, -5.9301, 'Derived from stated location: near Belfast, Northern Ireland'],
            'Haotian Zong': ['Baltimore', 39.2904, -76.6122, 'Derived from stated location: Baltimore, Maryland'],
            'Abass': ['Cape Town', -33.9249, 18.4241, 'Inferred from current AIMS South Africa affiliation; AIMS South Africa is in Cape Town'],
            'Viju Sudhi': ['Bielefeld', 52.0302, 8.5325, 'Derived from stated location: Bielefeld, Germany'],
            'Cole Alexander Niblett': ['Santa Cruz', 36.9741, -122.0308, 'Derived from stated location: Santa Cruz, California'],
            'Rashika Kukreja': ['Tübingen', 48.5216, 9.0576, 'Derived from stated location: Tübingen, Germany'],
            'Hannah Arjonillo': ['Metro Manila', 14.5995, 120.9842, 'Derived from stated location: Metro Manila, Philippines'],
            'Chris Reuter': ['Mannheim', 49.4875, 8.466, 'Derived from stated location: Mannheim, Germany'],
            'Heming Liu': ['Urbana-Champaign', 40.1106, -88.2073, 'Derived from stated location: Urbana-Champaign, Illinois'],
            'Arseniy Kryazhev': ['San Diego', 32.7157, -117.1611, 'Derived from stated location: San Diego, California'],
            'Aniket Deshpande': ['Urbana-Champaign', 40.1106, -88.2073, 'Derived from stated location: Urbana-Champaign, Illinois'],
            'Wentian Zhu': ['Athens, Georgia', 33.9519, -83.3576, 'Derived from stated location: Athens, Georgia'],
            'Parth Vashisht': ['Lowell', 42.6334, -71.3162, 'Derived from stated location: Lowell, Massachusetts'],
            'Sergei Kudriashov': ['Hong Kong', 22.3193, 114.1694, 'Derived from stated location: Hong Kong'],
            'Alex Flores': ['Bern', 46.948, 7.4474, 'Derived from stated location: Bern, Switzerland'],
            'Elisabetta Rocchetti': ['Milan', 45.4642, 9.19, 'Derived from stated primary location: Milan, Italy'],
            'Harshvardhan Saini': ['Dhanbad', 23.7957, 86.4304, 'Derived from stated location: Dhanbad, India'],
            'Sai Suresh Macharla Vasu': ['Saarbrücken', 49.2402, 6.9969, 'Inferred from current Saarland University affiliation; Saarland University is in Saarbrücken, Germany'],
            'Vaughn Papenhausen': ['Columbus', 39.9612, -82.9988, 'Derived from stated location: Columbus, Ohio'],
            'Trevor Xing-Xie': ['Nashville', 36.1627, -86.7816, 'Derived from stated location: Nashville, Tennessee'],
          };
          for (const person of data.people) {
            const loc = locations[person.name];
            if (!loc) continue;
            person.map_location = { city: loc[0], lat: loc[1], lng: loc[2], evidence: loc[3] };
          }
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');

          // Canonical JSON is authoritative: future audits may fill missing locations,
          // but must never overwrite an explicit map_location already stored there.
          const script = 'scripts/build-fall26-directory.mjs';
          let source = fs.readFileSync(script, 'utf8');
          source = source.replace(
            'const mapped = person.location\n    ? locationFrom(`based in ${person.location}`)\n    : null;',
            'const mapped = person.map_location || (person.location\n    ? locationFrom(`based in ${person.location}`)\n    : null);',
          );
          source = source.replace(
            'map_location: mapped\n      ? {\n          city: mapped.city,\n          lat: mapped.lat,\n          lng: mapped.lng,\n          evidence: `Derived from stated Fall 2026 location: ${person.location}`,\n        }\n      : null,',
            'map_location: person.map_location || (mapped\n      ? {\n          city: mapped.city,\n          lat: mapped.lat,\n          lng: mapped.lng,\n          evidence: `Derived from stated Fall 2026 location: ${person.location}`,\n        }\n      : null),',
          );
          fs.writeFileSync(script, source);
          NODE
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/audit-unmapped-universities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spar_fall_2026_introductions.json scripts/build-fall26-directory.mjs .github/workflows/audit-unmapped-universities.yml
          git commit -m "Store resolved participant locations in canonical JSON"
          git push origin HEAD:main
